        .petals {
            position: absolute;
            inset: 0;

            pointer-events: none;

            top: -60px;

            opacity: .8;

            animation:
                fall
                var(--duration)
                linear
                infinite;

            animation-delay: var(--delay);
        }


        @keyframes fall {

            0% {

                        0
